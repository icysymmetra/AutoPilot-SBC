name: Package extension

# Builds the Chrome Web Store upload zip from the runtime files only, and
# publishes a GitHub release whose notes come from data/changelog.json.
#
# Download the artifact from the run summary, then upload it at
# https://chrome.google.com/webstore/devconsole

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: package-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build store zip
    runs-on: ubuntu-latest
    steps:
      # Full history and tags so the previous release tag can be resolved.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only ship what the extension loads at runtime. Anything else (tests,
      # docs, prototypes, replay data) bloats the package and risks rejection.
      - name: Stage runtime files
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/page dist/solver dist/data dist/icons
          cp manifest.json background.js content-script.js dist/
          cp page/ea-data-bridge.js page/ea-data-bridge.css dist/page/
          cp solver/solver.js \
             solver/chemistry.js \
             solver/constraint-compiler.js \
             solver/concept-players.js \
             solver/worker.js \
             solver/glpk.js \
             solver/glpk.wasm dist/solver/
          cp data/changelog.json dist/data/
          cp icons/*.png dist/icons/

      # Fails the build if the manifest references a file that is not present,
      # if the solver module graph is incomplete, or if development files leaked in.
      - name: Validate bundle
        run: node .github/validate-bundle.cjs dist

      - name: Read version
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          NAME=$(node -p "require('./manifest.json').name")
          if [ -z "$VERSION" ]; then
            echo "Could not read version from manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ext_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=autopilotsbc-fc27-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "artifact_name=autopilotsbc-fc27-v${VERSION}" >> "$GITHUB_OUTPUT"

      # Explicit paths keep the archive entries clean: manifest.json must sit at
      # the archive root with no leading "./". -D omits directory-only entries.
      - name: Create store zip
        run: |
          set -euo pipefail
          cd dist
          zip -r -X -D "../${{ steps.meta.outputs.zip_name }}" \
            manifest.json background.js content-script.js \
            page solver data icons
          cd ..
          ls -lh "${{ steps.meta.outputs.zip_name }}"

      - name: Verify zip layout
        run: |
          set -euo pipefail
          ZIP="${{ steps.meta.outputs.zip_name }}"
          ENTRIES=$(unzip -Z1 "$ZIP")
          echo "$ENTRIES"
          # The store requires manifest.json at the archive root.
          echo "$ENTRIES" | grep -qx "manifest.json" || {
            echo "manifest.json is not at the archive root" >&2
            exit 1
          }
          # Guard against accidental development files in the package.
          if echo "$ENTRIES" | grep -Eq '\.test\.mjs$|^docs/|^prototypes/|^benchmark-runs/|\.map$'; then
            echo "development files found in the archive" >&2
            exit 1
          fi
          # Exactly one file under data/, regardless of directory entries.
          DATA_FILES=$(echo "$ENTRIES" | grep -Ec '^data/[^/]+$' || true)
          if [ "$DATA_FILES" -ne 1 ]; then
            echo "expected exactly 1 file under data/, found $DATA_FILES" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 90

      # Resolve which tag this version belongs to and the release before it.
      - name: Determine release
        id: release
        run: |
          set -euo pipefail
          TAG="v${{ steps.meta.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          # When the current tag already exists on HEAD, step one tag further back.
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" = "$TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          fi

          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          echo "Previous release tag: ${PREV_TAG:-none}"
          git tag --list --sort=-creatordate | head -5

      - name: Generate release notes
        env:
          PREV_TAG: ${{ steps.release.outputs.prev_tag }}
        run: |
          set -euo pipefail
          rm -f commits.txt commits-all.txt
          if [ -n "$PREV_TAG" ]; then
            # Write to a file first: piping git log into head trips pipefail via SIGPIPE.
            git log --no-merges --pretty='%h %s' "${PREV_TAG}..HEAD" > commits-all.txt
            head -50 commits-all.txt > commits.txt
          fi
          node .github/release-notes.cjs \
            --repo "${{ github.repository }}" \
            --out release-notes.md \
            --prev-tag "$PREV_TAG" \
            --commits commits.txt
          echo "--- notes preview ---"
          head -30 release-notes.md

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.ext_name }} ${TAG}"
          ZIP="${{ steps.meta.outputs.zip_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing notes and asset."
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              "$ZIP"
          fi

      - name: Summary
        run: |
          {
            echo "### Extension package"
            echo ""
            echo "- Name: \`${{ steps.meta.outputs.ext_name }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Archive: \`${{ steps.meta.outputs.zip_name }}\`"
            echo "- Release tag: \`${{ steps.release.outputs.tag }}\`"
            if [ -n "${{ steps.release.outputs.prev_tag }}" ]; then
              echo "- Previous release: \`${{ steps.release.outputs.prev_tag }}\`"
            else
              echo "- Previous release: none (first release)"
            fi
            echo ""
            echo "Download the artifact from this run, then upload the zip at the [Chrome Web Store developer dashboard](https://chrome.google.com/webstore/devconsole)."
          } >> "$GITHUB_STEP_SUMMARY"
